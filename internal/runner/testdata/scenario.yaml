# Scénario de bout en bout : pagination de la liste des commandes.
planner:
  plan:
    - task: {key: contract, role: contracts, title: "Contrat paginé pour GET /orders", spec: "page, per_page, OrderPage"}
    - task: {key: api, role: back, title: "Pagination côté API", spec: "Implémenter GET /orders paginé", after: [contract]}
    - task: {key: ui, role: front, title: "Pagination de la liste", spec: "Composant de pagination", after: [contract]}

contracts:
  task:
    - write: {path: contracts/openapi.yaml, content: "openapi: 3.1.0\npaths:\n  /orders: {}\n"}
    - done: "OrderPage ajouté"

back:
  task:
    - write: {path: api/orders.go, content: "package api\n\n// ListOrders renvoie une page de commandes.\nfunc ListOrders() {}\n"}
    - done: "Endpoint paginé"

front:
  task:
    - write: {path: web/OrderList.tsx, content: "export function OrderList() { return null }\n"}
    - done: "Composant de pagination ajouté"
